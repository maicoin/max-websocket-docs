name: Generated documentation

# Fails when a generated block in the markdown no longer matches ws_surface.json.
# Fix it by running `npm run ws-docs` and committing the result.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ws-docs.js --check
